interface:
  display_name: "On-Call Investigation"
  short_description: "Correlate tickets, code, metrics, logs, and releases during incidents"
  default_prompt: "Use $oncall-investigation with the team's service config to investigate an incident across tickets, docs, metrics, logs, releases, and code. Follow the skill workflow for classification, source-of-truth selection, NOC checks, impact analysis, and writeback. Validate required auth before evidence collection, use supported automatic recovery for invalid tokens, and ask the user to fix unresolved blockers before continuing. Do not automatically write back blocked investigations; if the user asks for a blocked ticket comment, write only blockers and next step, then add ai-triage-blocked. After blockers are fixed and the investigation completes, use the full writeback process. When writing back, include the active On-Call Investigation skill version."
