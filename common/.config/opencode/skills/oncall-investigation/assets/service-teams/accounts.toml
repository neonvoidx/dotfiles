[[team]]
name = "Accounts Service"
description = "On-call investigation config for Accounts service across API and operational surfaces."

[team.tickets]
jira_projects = ["AC"]
ots_projects = ["AC"]

[[team.code.repositories]]
name = "bling"
role = "control-plane"
bitbucket_repo = "https://bitbucket.oci.oraclecorp.com/projects/ACC/repos/bling/browse"
local_repo_path = "/absolute/path/to/local/bling"

[[team.code.repositories]]
name = "account-service-terraform"
role = "config"
bitbucket_repo = "https://bitbucket.oci.oraclecorp.com/projects/ACC/repos/account-service-terraform/browse"
local_repo_path = "/absolute/path/to/local/account-service-terraform"

[[team.code.repositories]]
name = "account-tool-terraform"
role = "config"
bitbucket_repo = "https://bitbucket.oci.oraclecorp.com/projects/ACC/repos/account-tool-terraform/browse"
local_repo_path = "/absolute/path/to/local/account-tool-terraform"

[[team.code.repositories]]
name = "account-operations-terraform"
role = "operations"
bitbucket_repo = "https://bitbucket.oci.oraclecorp.com/projects/ACC/repos/account-operations-terraform/browse"
local_repo_path = "/absolute/path/to/local/account-operations-terraform"

[[team.observability.alarm_sources]]
name = "Accounts service alarms"
kind = "phonebook_project"
phonebook = "accounts"
project = "Accounts"

[[team.observability.metric_fleets]]
name = "primary"
role = "control-plane"
project = "Accounts"
fleet = "account-service"

[[team.observability.metric_fleets]]
name = "Accounts-canary"
role = "canary"
project = "Accounts"
fleet = "accounts-service-canary"

[team.canary]
phonebook = "accounts"
service_project = "account-service"

[team.sqlcl]
connection_name = "Accounts-phx-sqlcl"
connect_string = "//localhost:10803/s_bling_accounts.r2"
username = "blingAccountRO[Readonlyuser]"
password_env_var = "ACCOUNTS_SQLCL_PASSWORD"
tunnel_command = "ssh -v -L 10803:kiev-bling-accounts.svc.r2:1521 bastion-ad1.rb.us-phoenix-1.oci.oracleiaas.com"
notes = "Run the tunnel and keep it open before using SQLcl or the SQLcl MCP connection."

[team.lumberjack]
phonebook = "accounts"
project = "Accounts"
tenant_name = "bmc_accounts"
notes = "Namespaces are not uniform. Resolve namespaces from ticket/alarm region + AD + time, then search using namespace prefix `bling-accounts*` in Lumberjack UI/API before narrowing further."

# Keep at least one known-good namespace sample from observed incident evidence.
[[team.lumberjack.namespaces]]
name = "sample-iad-ad1"
role = "control-plane"
namespace = "bling-accounts_<ad>_<region>"
region = "us-ashburn-1"

[team.splat]
tenant_name = "splat"

[[team.splat.namespaces]]
name = "splat-proxy"
namespace = "splat-proxy-overlay"

[team.shepherd]
phonebook = "accounts"
project = "accounts"

[[team.shepherd.flocks]]
name = "primary"
flock = "account-service"
