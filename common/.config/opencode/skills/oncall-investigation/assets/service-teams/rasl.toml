[[team]]
name = "Reclaim and Subscription Lifecycle"
description = "On-call investigation config for Reclaim and Subscription Lifecycle (RASL) across API, worker, processor, and canary surfaces."

[team.tickets]
jira_projects = ["RASL"]
ots_projects = ["RASL"]

[[team.code.repositories]]
name = "reclaim-and-subscription-lifecycle"
role = "control-plane"
bitbucket_repo = "https://bitbucket.oci.oraclecorp.com/projects/RASL/repos/reclaim-and-subscription-lifecycle/browse"
local_repo_path = "/absolute/path/to/local/reclaim-and-subscription-lifecycle"

[[team.observability.alarm_sources]]
name = "RASL alarms"
kind = "phonebook_project"
phonebook = "reclaim_service"
project = "ReclaimAndSubscriptionLifecycle"

[[team.observability.metric_fleets]]
name = "api"
role = "control-plane"
project = "ReclaimAndSubscriptionLifecycle"
fleet = "reclaim-and-subscription-lifecycle-api"

[[team.observability.metric_fleets]]
name = "worker"
role = "worker"
project = "ReclaimAndSubscriptionLifecycle"
fleet = "reclaim-and-subscription-lifecycle-worker"

[[team.observability.metric_fleets]]
name = "processor"
role = "processor"
project = "ReclaimAndSubscriptionLifecycle"
fleet = "reclaim-and-subscription-lifecycle-processor"

[[team.observability.metric_fleets]]
name = "canary"
role = "canary"
project = "test-service"
fleet = "canary-run-results"

[team.canary]
phonebook = "reclaim_service"
canary_names = ["reclaim_service"]
notes = "Canary URL currently points to us-ashburn-1/reclaim_service."

[team.lumberjack]
phonebook = "reclaim_service"
project = "ReclaimAndSubscriptionLifecycle"
tenant_name = "rasl"
tenant_names_by_environment = { prod = "rasl", dev = "rasl-dev", pint = "rasl-dev", pint2 = "rasl-dev-pint2" }
notes = "Processor logs are expected mainly in IAD for pint and pint2, plus alloy realms and some DRCC realms. The `pint` environment reuses the dev tenant mapping; add explicit pint namespace entries only when the service proves they differ from the dev namespace family."

[[team.lumberjack.namespaces]]
name = "api-prod"
role = "control-plane"
namespace = "rasl-api-oc1"
environment = "prod"

[[team.lumberjack.namespaces]]
name = "worker-prod"
role = "worker"
namespace = "rasl-worker-oc1"
environment = "prod"

[[team.lumberjack.namespaces]]
name = "api-dev"
role = "control-plane"
namespace = "rasl-api-oc1-dev"
environment = "dev"

[[team.lumberjack.namespaces]]
name = "worker-dev"
role = "worker"
namespace = "rasl-worker-oc1-dev"
environment = "dev"

[[team.lumberjack.namespaces]]
name = "processor-dev"
role = "processor"
namespace = "rasl-processor-oc1-dev"
environment = "dev"

[[team.lumberjack.namespaces]]
name = "api-pint2"
role = "control-plane"
namespace = "rasl-api-oc1-dev-pint2"
environment = "pint2"

[[team.lumberjack.namespaces]]
name = "worker-pint2"
role = "worker"
namespace = "rasl-worker-oc1-dev-pint2"
environment = "pint2"

[team.splat]
tenant_name = "splat"
notes = "Use splat tracing for API availability and downstream 5xx investigations."

[[team.splat.namespaces]]
name = "splat-proxy"
namespace = "splat-proxy"

[[team.splat.namespaces]]
name = "splat-proxy-overlay"
namespace = "splat-proxy-overlay"
