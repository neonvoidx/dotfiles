version = 1

# AAT Service OKE config
#
# Minimum for a new realm:
#
# [realms.ocNN]
# region = "<oci-region>"
# profile = "ocNN-aat"
#
# The generic helper may auto-populate these safe optional fields after
# discovery, so users usually do not need to provide them up front:
# - alias: region key used in SSH host names, such as jsk or ifp
# - compartment_id: AAT service compartment for OKE/ADB discovery
# - bastion_compartment_id: only when different from compartment_id
# - realm_domain: only when OSSH metadata cannot derive it
#
# Use --no-update-config for a read-only run that does not write learned
# values back into this file.

[service]
key = "aat"
display_name = "Account Admin Tool"
aliases = ["aat", "account-admin-tool", "account admin tool"]
permissions_slug = "account-admin-tool"
tenancy_name = "account_admin_tool"
tenancy_source = "Shared Service OKE fallback config"
host_prefix = "aat-service"

[profile]
template = "{realm}-aat"

[paths]
ssh_config = "$HOME/.ssh/account-admin-tool-dev-tools/ssh_configs/config_aat"
kubeconfig_backup_template = "$HOME/.kube/config.{realm}.bkp"

[jit]
role = "prod-admin"
propagation_url = "https://devops.oci.oraclecorp.com/secret-service/us-ashburn-1/namespace/account-admin-tool/secret/dbpassword"
propagation_secret_name = "dbpassword"
propagation_path = "/secret/account-admin-tool/dbpassword/latest"

[tunnel]
local_oke_port = 6443
remote_oke_port = 6443

[[tunnel.extra_forwards]]
name = "aatadb"
local_port = 1522
remote_port = 1522
resource_type = "autonomous_database"
display_name = "AATADB"
required = true

[discovery]
mode = "live_oci"
notes = "Use live OCI to refresh OKE node IPs before tunnel setup. Use the generic setup_service_oke_realm.py helper with this service config."

# Existing realms. Keep each realm as small as possible: region/profile are the
# human-provided baseline; learned optional fields may be added by the helper.

