# Essential settings
unbind C-b
set -g prefix C-t
bind C-t send-prefix
setw -g mode-keys vi
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Pane indexes must stay tidy because the status plugin runs on renumbering.
set -g pane-border-style fg=#323449
set -g pane-active-border-style fg=#04d1f9
set -g message-style bg=#04d1f9,fg=#212337
set -g message-command-style bg=#04d1f9,fg=#212337
set -g mode-style bg=#04d1f9,fg=#212337

# Keybindings
bind R source-file ~/.config/tmux/tmux.conf \; display-message 'tmux.conf reloaded'
bind v split-window -h -c '#{pane_current_path}'
bind b split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind x kill-pane
bind '{' swap-pane -U
bind '}' swap-pane -D
bind z resize-pane -Z
bind m resize-pane -Z
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# smart-splits.nvim marks Neovim panes so tmux can forward navigation and
# resize bindings to its internal splits before falling back to tmux panes.
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'
bind-key -n C-S-h if -F "#{@pane-is-vim}" 'send-keys C-S-h' 'resize-pane -L 3'
bind-key -n C-S-j if -F "#{@pane-is-vim}" 'send-keys C-S-j' 'resize-pane -D 3'
bind-key -n C-S-k if -F "#{@pane-is-vim}" 'send-keys C-S-k' 'resize-pane -U 3'
bind-key -n C-S-l if -F "#{@pane-is-vim}" 'send-keys C-S-l' 'resize-pane -R 3'

# Interactive resize mode: prefix+r, then hjkl or arrow keys to resize.
bind r set -g key-table resize
bind -T resize h resize-pane -L 5
bind -T resize j resize-pane -D 5
bind -T resize k resize-pane -U 5
bind -T resize l resize-pane -R 5
bind -T resize Left resize-pane -L 5
bind -T resize Down resize-pane -D 5
bind -T resize Up resize-pane -U 5
bind -T resize Right resize-pane -R 5
bind -T resize q set -g key-table root
bind -T resize Escape set -g key-table root
bind -T resize Enter set -g key-table root
bind -r '-' resize-pane -L 5
bind -r '=' resize-pane -R 5

bind d detach-client
bind t command-prompt -I '#S' 'rename-session -- "%%"'
bind '$' command-prompt -I '#S' 'rename-session -- "%%"'
bind ',' command-prompt -I '#W' 'rename-window -- "%%"'
bind C-h select-window -t :-
bind C-j select-window -t :+
bind '<' swap-window -t -1
bind '>' swap-window -t +1
bind o run-shell "sesh connect \"$(
  sesh list --icons | fzf --tmux 80% 80% \
  --no-sort --ansi --border-label ' sesh ' --prompt '🗲  ' \
  --header '  ^a all ^t tmux ^g configs ^x zoxide &d tmux kill ^f find' \
  --bind 'tab:down,btab:up' \
  --bind 'ctrl-a:change-prompt(🗲 )+reload(sesh list --icons)' \
  --bind 'ctrl-t:change-prompt( )+reload(sesh list --icons -t)' \
  --bind 'ctrl-g:change-prompt(⚙️)+reload(sesh list --icons -c)' \
  --bind 'ctrl-x:change-prompt( )+reload(sesh list --icons -z)' \
  --bind 'ctrl-f:change-prompt( )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
  --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(🗲 )+reload(sesh list --icons)' \
  --preview-window 'right:55%' \
  --preview 'sesh preview {}' \
  -- --ansi
)\""

# TPM plugins. Keep downloaded plugin sources outside the Stow-managed config.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'jaclu/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'eldritch-theme/tmux'

# Restore known long-running interactive programs. `*` retains their saved args,
# such as OpenCode's `--continue`, rather than launching a bare command.
# Neovim sessions are managed by persistence.nvim rather than Session.vim.
set -g @resurrect-processes 'ssh "~nvim->~/.local/bin/tmux-resurrect-nvim" "opencode->opencode *"'
# Replaying pane output races process restoration: the restore command can be
# sent while `cat` is still writing the saved screen instead of to the shell.
set -g @resurrect-capture-pane-contents 'off'
# Save and restore only the default session so sesh project sessions stay fresh.
set -g @resurrect-hook-post-save-layout '~/.local/bin/tmux-resurrect-default-only'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @eldritch_variant 'cthulhu'

run '~/.tmux/plugins/tpm/tpm'

# Component status lin
set -g status-left-length 100
set -g status-right-length 100
set -g status-justify left
set -g status-left ''
set -g status-right ' #[fg=#04d1f9,bg=#212337] #[fg=#04d1f9,bg=#212337,bold]#S'
setw -g window-status-separator ' '
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
setw -g window-status-format '#[fg=#323449,bg=#212337]#[fg=#ebfafa,bg=#323449] #I #[fg=#212337,bg=#7081d0] #{b:pane_current_path} #[fg=#7081d0,bg=#212337]'
setw -g window-status-current-format '#[fg=#323449,bg=#212337]#[fg=#37f499,bg=#323449,bold] #I #[fg=#212337,bg=#37f499,bold] #{b:pane_current_path} #[fg=#37f499,bg=#212337]'
# Below will make a separator line
# setw -g pane-border-status bottom
# setw -g pane-border-format ''
# Below will make 2 status bars with one being blank
set -Fg 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[0]' ''
set -g status 2
