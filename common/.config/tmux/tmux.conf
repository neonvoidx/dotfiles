set  -g default-terminal "tmux-256color"
set  -g base-index      1
setw -g pane-base-index 1
# tmux requires an absolute shell path; resolve zsh from this host’s PATH.
if-shell 'command -v zsh >/dev/null 2>&1' {
  run-shell 'tmux set-option -g default-shell "$(command -v zsh)"'
}

set -g status-keys vi
set -g mode-keys   vi

# rebind main key: C-t
unbind C-b
set -g prefix C-t
bind -N "Send the prefix key through to the application" \
  C-t send-prefix

set  -g mouse             on
set  -g focus-events      off
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       0
set  -g history-limit     10000

# TPM plugins. Keep downloaded sources outside the Stow-managed config.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'jaclu/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Match Neovim even when the saved command uses an absolute path, then
# load the cwd-specific persistence.nvim session.
set -g @resurrect-processes 'ssh "~nvim->~/.local/bin/tmux-resurrect-nvim" "opencode->opencode *"'
# Pane-content replay races process restoration and can leave
# a shell displaying stale output instead of the restored app.
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Preserve Wayland sockets on reattach when running on Linux.
set -ga update-environment " HYPRLAND_INSTANCE_SIGNATURE UMBRIEL_MAIN_OUT UMBRIEL_SECONDARY_OUT UMBRIEL_PORTRAIT_OUT"

# Refresh sesh's cache when sessions change outside its picker.
if-shell 'command -v sesh >/dev/null 2>&1' {
  set-hook -g session-created 'run-shell -b "sesh cache refresh"'
  set-hook -g session-closed 'run-shell -b "sesh cache refresh"'
}

# Allow OSC52 passthrough so apps inside tmux (e.g. lazygit) can
# reach the outer terminal's clipboard.
set -g allow-passthrough on

# Pane indexes must stay tidy because the status plugin runs on renumbering.
set -g renumber-windows on
setw -g pane-base-index 1

# Pass modified keys (Shift+Enter, Ctrl+Enter, etc.) to programs inside tmux
set -g extended-keys on
set -as terminal-features ',xterm*:extkeys,RGB'

# Eldritch colors, kept local instead of sourcing a generated Nix theme.
set -g status-style bg=#212337,fg=#ebfafa
setw -g clock-mode-colour '#04d1f9'

# Pane border
set -g pane-border-style fg=#3b4261
set -g pane-active-border-style fg=#04d1f9

# Message / command prompt
set -g message-style bg=#04d1f9,fg=#212337
set -g message-command-style bg=#04d1f9,fg=#212337

# Mode (copy-mode) indicator
set -g mode-style bg=#04d1f9,fg=#212337

# -------------------------------------------------
# Keybindings
# -------------------------------------------------

# Reload config
bind R source-file ~/.config/tmux/tmux.conf \; display-message 'tmux.conf reloaded'

# Splits (open in current pane directory)
#   v = vertical split (side-by-side), b = horizontal split (stacked)
bind v split-window -h -c '#{pane_current_path}'
bind b split-window -v -c '#{pane_current_path}'

# Terminal windows
bind c new-window -c '#{pane_current_path}'

# Kill pane without prompt
bind x kill-pane

# Swap panes
bind '{' swap-pane -U
bind '}' swap-pane -D

# Zoom
bind z resize-pane -Z
bind m resize-pane -Z

# Resize bindings (shift+hjkl)
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Smart pane navigation with Neovim-split awareness (smart-splits.nvim).
# '@pane-is-vim' is a pane-local option set by smart-splits on load; when
# the pane runs neovim the key is forwarded so nvim can move between its
# own splits first, otherwise tmux selects the adjacent pane directly.
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'

# Smart pane resize with Neovim-split awareness (Ctrl+Shift+hjkl)
bind-key -n C-S-h if -F "#{@pane-is-vim}" 'send-keys C-S-h' 'resize-pane -L 3'
bind-key -n C-S-j if -F "#{@pane-is-vim}" 'send-keys C-S-j' 'resize-pane -D 3'
bind-key -n C-S-k if -F "#{@pane-is-vim}" 'send-keys C-S-k' 'resize-pane -U 3'
bind-key -n C-S-l if -F "#{@pane-is-vim}" 'send-keys C-S-l' 'resize-pane -R 3'

# Interactive resize mode: prefix+r, then hjkl / arrows to resize,
# q / Esc / Enter to exit back to normal mode
bind r set -g key-table resize
bind -T resize h resize-pane -L 5
bind -T resize j resize-pane -D 5
bind -T resize k resize-pane -U 5
bind -T resize l resize-pane -R 5
bind -T resize Left resize-pane -L 5
bind -T resize Down resize-pane -D 5
bind -T resize Up resize-pane -U 5
bind -T resize Right resize-pane -R 5
bind -T resize q set -g key-table root
bind -T resize Escape set -g key-table root
bind -T resize Enter set -g key-table root

# Incremental resize (repeatable): prefix+- / prefix++
bind -r '-' resize-pane -L 5
bind -r '+' resize-pane -R 5

# Detach
bind d detach-client

set -g detach-on-destroy off

# Keep tmux's last-session behavior stable even after sessions are closed.
bind -N "last-session (via sesh)" O run-shell "sesh last"

# Fast sesh picker. run-shell has no tty, which breaks fzf, so run
# the picker inside a display-popup (its own pty) and close on exit.
bind -N "sesh picker" o display-popup -E -w 80% -h 70% 'SESH_IN_POPUP=1 ~/.local/bin/sesh-fast'

# Window picker via sesh.
bind -N "sesh window picker" W display-popup -E -w 70% -h 60% 'SESH_IN_POPUP=1 ~/.local/bin/sesh-fast-window'

# Session management
bind t command-prompt -I '#S' 'rename-session -- "%%"'
bind , command-prompt -I '#W' 'rename-window "%%"'

# Window navigation (with prefix)
bind C-h select-window -t :-
bind C-j select-window -t :+

# Move window
bind '<' swap-window -t -1
bind '>' swap-window -t +1

# -------------------------------------------------
# Component status line
# -------------------------------------------------
set -g status-left-length 100
set -g status-right-length 100
set -g status-justify left
set -g status-left ''
set -g status-right '#[fg=#{?#{==:#{client_key_table},prefix},#37f499,#04d1f9},bg=#212337] #S'
setw -g window-status-separator ' '
setw -g automatic-rename on
setw -g automatic-rename-format '#{pane_current_command}'
setw -g window-status-format '#[fg=#323449,bg=#212337]#[fg=#ebfafa,bg=#323449] #I #[fg=#212337,bg=#7081d0] #{pane_current_command} #[fg=#7081d0,bg=#212337]'
setw -g window-status-current-format '#[fg=#323449,bg=#212337]#[fg=#37f499,bg=#323449,bold] #I #[fg=#212337,bg=#37f499,bold] #{pane_current_command} #[fg=#37f499,bg=#212337]'
# Empty statusline above for spacing
set -Fg 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[0]' ""
set -g status 2

# Load after status-right is configured so Continuum's autosave hook survives.
# Install TPM at ~/.tmux/plugins/tpm, then press prefix + I to install plugins.
if-shell 'test -f ~/.tmux/plugins/tpm/tpm' 'run-shell ~/.tmux/plugins/tpm/tpm'
