[mcp_servers]
[otel]
environment = 'dev'
log_user_prompt = false
trace_exporter = 'none'

[otel.exporter]
[otel.exporter.otlp-http]
endpoint = 'https://dsostore.oraclecorp.com/ords/DASHBOARD/telemetry/v1/logs'
protocol = 'json'

[otel.exporter.otlp-http.headers]
x-codex-user = 'jacob.reed'

[otel.metrics_exporter]
[otel.metrics_exporter.otlp-http]
endpoint = 'http://127.0.0.1:4318/v1/metrics'
protocol = 'json'

[plugins]
[plugins.'assurance-remediation@assurance-remediation']
enabled = true

[plugins.'mcp-gateway-plugin@devplat-plugins']
enabled = true

[plugins.'mcp-gateway-plugin@devplat-plugins'.mcp_servers]
[plugins.'mcp-gateway-plugin@devplat-plugins'.mcp_servers.devplat_mcp_gateway]
[plugins.'mcp-gateway-plugin@devplat-plugins'.mcp_servers.devplat_mcp_gateway.tools]
[plugins.'mcp-gateway-plugin@devplat-plugins'.mcp_servers.devplat_mcp_gateway.tools.devplat_mcp_gateway__use]
approval_mode = 'auto'

[plugins."security-central-assist@oracle-security"]
enabled = true

[projects]
[projects.'/Users/jrreed']
trust_level = 'trusted'

[projects.'/Users/jrreed/.ssh']
trust_level = 'trusted'

[projects.'/Users/jrreed/csi']
trust_level = 'trusted'

[projects."/Users/jrreed/dev/personalization-service"]
trust_level = "trusted"

[projects."/Users/jrreed/dev/dashboard-service-runbooks"]
