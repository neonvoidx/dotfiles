model = 'gpt-5.5'
model_reasoning_effort = 'high'
sandbox_mode = 'workspace-write'
approval_policy = 'never'
web_search_request = true

[agents]
max_depth = 1
max_threads = 8

[agents.code-researcher]
config_file = '/Users/jrreed/.codex/agents/code-researcher.toml'
description = 'Use code history and architectural context to recommend sustainable technical direction.'

[agents.code-tester]
config_file = '/Users/jrreed/.codex/agents/code-tester.toml'
description = 'Maximize test confidence with deterministic coverage, low flakiness, and clear validation output.'

[agents.code-writer]
config_file = '/Users/jrreed/.codex/agents/code-writer.toml'
description = 'Implement high-quality production code aligned with project rules and the smallest safe change.'

[agents.explorer]
config_file = '/Users/jrreed/.codex/agents/explorer.toml'
description = 'Explore a codebase deeply before implementation, mapping entry points, structure, and risks.'

[agents.reviewer]
config_file = '/Users/jrreed/.codex/agents/reviewer.toml'
description = 'Perform findings-first code review focused on correctness, regressions, security, and missing tests.'

[agents.software-architect]
config_file = '/Users/jrreed/.codex/agents/software-architect.toml'
description = 'Shared software architect guidance for producing implementation-ready proposals, ADRs, and migration plans.'

[features]
multi_agent = true

