[[team]]
name = "Orgs/Subs"
description = "On-call investigation config for the Orgs/Subs service across control-plane, data-plane, and canary."

[team.tickets]
jira_projects = ["ORGMGMT"]
ots_projects = ["ORGMGMT"]

[[team.code.repositories]]
name = "control-plane"
role = "control-plane"
bitbucket_repo = "https://bitbucket.oci.oraclecorp.com/projects/ACT/repos/tenant-manager/browse"
local_repo_path = "/absolute/path/to/local/tenant-manager"

[[team.code.repositories]]
name = "data-plane"
role = "data-plane"
bitbucket_repo = "https://bitbucket.oci.oraclecorp.com/projects/ACT/repos/tenant-manager-data-plane/browse"
local_repo_path = "/absolute/path/to/local/tenant-manager-data-plane"

[[team.code.repositories]]
name = "canary"
role = "canary"
bitbucket_repo = "https://bitbucket.oci.oraclecorp.com/projects/ACT/repos/tenant-manager-canary/browse"
local_repo_path = "/absolute/path/to/local/tenant-manager-canary"

[[team.code.repositories]]
name = "governance-rules-control-plane"
role = "governance-rules-control-plane"
bitbucket_repo = "https://bitbucket.oci.oraclecorp.com/projects/ACT/repos/governance-rules-control-plane/browse"
local_repo_path = "/absolute/path/to/local/governance-rules-control-plane"

[[team.code.repositories]]
name = "governance-rules-canary"
role = "governance-rules-canary"
bitbucket_repo = "https://bitbucket.oci.oraclecorp.com/projects/ACT/repos/governance-rules-canary/browse"
local_repo_path = "/absolute/path/to/local/governance-rules-canary"

[[team.code.repositories]]
name = "org-tenancy-plugin-maui"
role = "org-tenancy-plugin-maui"
bitbucket_repo = "https://bitbucket.oci.oraclecorp.com/projects/ACT/repos/org-tenancy-plugin-maui/browse"
local_repo_path = "/absolute/path/to/local/org-tenancy-plugin-maui"

[[team.code.repositories]]
name = "maui-order-activation-vnext"
role = "maui-order-activation-vnext"
bitbucket_repo = "https://bitbucket.oci.oraclecorp.com/projects/ACT/repos/maui-order-activation-vnext/browse"
local_repo_path = "/absolute/path/to/local/maui-order-activation-vnext"

[[team.code.repositories]]
name = "tenant-manager-data-plane-canary"
role = "tenant-manager-data-plane-canary"
bitbucket_repo = "https://bitbucket.oci.oraclecorp.com/projects/ACT/repos/tenant-manager-data-plane-canary/browse"
local_repo_path = "/absolute/path/to/local/tenant-manager-data-plane-canary"

[[team.observability.alarm_sources]]
name = "ORGMGMT TenantManager alarms"
kind = "phonebook_project"
phonebook = "orgmgmt"
project = "TenantManager"

[[team.observability.metric_fleets]]
name = "control-plane-api"
role = "control-plane"
project = "TenantManager"
fleet = "tenant-manager-control-plane-api"

[[team.observability.metric_fleets]]
name = "control-plane-worker"
role = "control-plane-worker"
project = "TenantManager"
fleet = "tenant-manager-worker"

[[team.observability.metric_fleets]]
name = "data-plane"
role = "data-plane"
project = "TenantManager"
fleet = "tenant-manager-data-plane-api"

[[team.observability.metric_fleets]]
name = "canary"
role = "canary"
project = "test-service"
fleet = "canary-run-results"

[team.odo]
phonebook = "orgmgmt"
notes = "Use ODO correlation for Flamingo, heartbeat, and single-AD capacity incidents."

[[team.odo.hints]]
name = "control-plane"
role = "control-plane"
application_aliases = ["tenantmanager-controlplane", "tenantmanager-controlplane-system-updater"]
application_alias_patterns = ["poes-updater-*"]

[[team.odo.hints]]
name = "data-plane"
role = "data-plane"
application_aliases = ["tenantmanager-dataplane", "tenantmanager-dataplane-system-updater"]
application_alias_patterns = ["poes-updater-*"]

[team.object_store]
default_compartment_name = "Resource"
default_tenancy_name = "tenantmanager"
tenancy_names_by_realm = { r1 = "tenantmgrdev", oc1 = "tenantmgrsubdev", oc2 = "oc2organizations", oc3 = "oc3organizations", oc4 = "organizations" }
notes = "Potential prefix buckets: bdb-backup-tenant-manager-data-plane, oci-logs.tenant-manager-control-plane, oci-logs.tenant-manager-data-plane, oci-logs.tenant-manager-worker"

[team.canary]
phonebook = "orgmgmt"
service_project = "tenant-manager-canary"

[team.lumberjack]
phonebook = "orgmgmt"
project = "TenantManager"
notes = "Configured namespaces are the known production defaults. Use phonebook/project discovery to resolve tenant and non-production namespace variants when alarm evidence points elsewhere."

[[team.lumberjack.namespaces]]
name = "control-plane-prod"
role = "control-plane"
namespace = "tenant-manager-control-plane"
environment = "prod"

[[team.lumberjack.namespaces]]
name = "worker-prod"
role = "control-plane-worker"
namespace = "tenant-manager-worker"
environment = "prod"

[[team.lumberjack.namespaces]]
name = "data-plane-prod"
role = "data-plane"
namespace = "tenant-manager-data-plane"
environment = "prod"

[team.splat]
tenant_name = "splat"
notes = "Use registered tenant-manager-api ServiceOperationId families to pivot quickly from SPLAT routing into control-plane or data-plane evidence."

[[team.splat.namespaces]]
name = "splat-proxy"
namespace = "splat-proxy"

[[team.splat.namespaces]]
name = "splat-proxy-overlay"
namespace = "splat-proxy-overlay"

[[team.splat.service_operations]]
name = "Tenant Manager control-plane family"
service_operation_pattern = "tenant-manager-api-cp*"
downstream_target = "control-plane"
notes = "Broad control-plane ServiceOperationId family for first-pass splat mining."

[[team.splat.service_operations]]
name = "Tenant Manager data-plane family"
service_operation_pattern = "tenant-manager-api-dp*"
downstream_target = "data-plane"
notes = "Broad data-plane ServiceOperationId family for first-pass splat mining."

[team.shepherd]
phonebook = "orgmgmt"
project = "tenant-manager"

[[team.shepherd.flocks]]
name = "control-plane"
flock = "tenant-manager-api"

[[team.shepherd.flocks]]
name = "data-plane"
flock = "tenant-manager-data-plane"
