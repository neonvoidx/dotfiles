  default_prompt: "Use $permissions-yaml-generator to ask the AuthZ Enablement ticket ID, SPLAT spec path, permissions documentation source, and plural alias preference in order, map SPLAT permissions against confluence guidance, present and confirm the mapping table, then emit the `<ticket-id>.yaml` Identity authZ file."
