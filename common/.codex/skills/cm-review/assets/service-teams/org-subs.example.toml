[[team]]
name = "Organization / Subscriptions"
description = "Repo-first CM review config for Org/Subs"

[team.match]
# Many CMs will live in a shared change project, so use service names and
# keywords in addition to project keys.
jira_projects = ["CHANGE", "ORGMGMT"]
service_owner_values = ["Organization Management"]
service_names = ["Organization Management", "Subscriptions", "Org/Subs", "Tenant Manager"]
ticket_labels = ["orgmgmt", "subscription", "subscription-mapping", "tenant-manager"]
keywords = ["organization", "subscription", "subscription mapping", "subscription update", "org/subs"]

[team.runbooks]
bitbucket_repo = "https://bitbucket.oci.oraclecorp.com/projects/ACT/repos/runbooks/browse"
local_repo_path = "/absolute/path/to/local/runbooks"
preferred_source = "local_repo"

